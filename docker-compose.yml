# Fortress Oil & Gas Helpdesk
#   1. cp .env.example .env      (then edit it: at least COMPANY_EMAIL_DOMAIN and ADMIN_EMAIL)
#   2. docker compose up -d --build
#   3. open http://localhost:3000        (staff: /agent and /admin)
services:
  helpdesk:
    build:
      context: .
      args:
        # Optional: BUILD_ID=$(git rev-parse --short HEAD) docker compose up -d --build   (shown as the version in Admin > System)
        BUILD_ID: ${BUILD_ID:-}
        BUILD_NOTE: ${BUILD_NOTE:-}
    image: fortress-helpdesk:latest
    container_name: fortress-helpdesk
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - helpdesk-data:/data   # the database + session key. Back this up (see README).
      # Backups on another disk or a NAS share (then set BACKUP_DIR=/backups in .env). Use your own path on the left:
      # - /volume1/backups/helpdesk:/backups

volumes:
  helpdesk-data:
